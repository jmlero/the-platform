apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - persistentvolumeclaim.yaml
  - deployment.yaml
  - service.yaml

images:
  - name: deck
    newName: ghcr.io/jmlero/the-platform-deck
    newTag: dev

labels:
  - pairs:
      app.kubernetes.io/name: deck
      app.kubernetes.io/part-of: the-platform
    includeSelectors: true
