        lease_state: { type: string, enum: [none, active, expiring, expired] }
        lease_expires_at: { type: integer, format: int64 }
        degraded_dependencies: { type: array, items: { type: string } }
        stale_projection_count: { type: integer, format: int64, minimum: 0 }
        rejected_projection_count: { type: integer, format: int64, minimum: 0 }
        last_error: { type: string }

    OperationalStateInput:
      type: object
      required: [environment, rollout_state, rollback_state, policy_version, source_revision]
      properties:
        environment: { type: string }
        rollout_state: { type: string }
        observation_started_at: { type: integer, format: int64 }
        observation_ends_at: { type: integer, format: int64 }
        rollback_state: { type: string }
        policy_version: { type: string }
        source_revision: { type: string }
        outcome: { type: string }

    OperationalState:
      allOf:
        - $ref: "#/components/schemas/OperationalStateInput"
        - type: object
          required: [id, project_id, task_id, run_id, updated_at]
          properties:
            id: { type: string }
            project_id: { type: string }
            task_id: { type: string }
            run_id: { type: string }
            updated_at: { type: integer, format: int64 }

    TrailEntry:
      type: object
      required: [id, stage, type, title, occurred_at]
      properties:
        id: { type: string }
        stage: { type: string, enum: [signal, decision, change, delivery, observation, verification, outcome] }
        type: { type: string }
        title: { type: string }
        resource_id: { type: string }
        payload: { type: object, additionalProperties: true }
        occurred_at: { type: integer, format: int64 }

    Artifact:
      type: object
      required: [id, task_id, run_id, name, kind, uri, content, digest, size_bytes, created_at]
      properties:
        id:
          type: string
        task_id:
          type: string
        run_id:
          type: string
        name:
          type: string
        kind:
          type: string
        uri:
          type: string
        content:
          type: string
        digest:
          type: string
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64

    TaskDetail:
      type: object
      required:
        - task
        - runs
        - plan_revisions
        - events
        - decisions
        - commands
        - artifacts
        - evidence
        - operational_states
        - provider_status
        - display_state
        - trail
      properties:
        task:
          $ref: "#/components/schemas/Task"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        plan_revisions:
          type: array
          items:
            $ref: "#/components/schemas/PlanRevision"
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/Decision"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
        commands:
          type: array
          items:
            $ref: "#/components/schemas/Command"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        operational_states:
          type: array
          items:
            $ref: "#/components/schemas/OperationalState"
        provider_status:
          $ref: "#/components/schemas/ProviderStatus"
        display_state:
          type: string
          enum: [planning, waiting, running, retrying, verifying, syncing, stale-evidence, blocked, completed, backlog, ready]
        trail:
          type: array
          items:
            $ref: "#/components/schemas/TrailEntry"

    Bootstrap:
      type: object
      required: [tasks, agents, decisions, events, channels, provider_status, now]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        agents:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/Decision"
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        provider_status:
          $ref: "#/components/schemas/ProviderStatus"
        now:
          type: integer
          format: int64

    Error:
      type: object
      x-fixtures:
        - ./fixtures/v1/errors/conflict.json
        - ./fixtures/v1/errors/forbidden.json
        - ./fixtures/v1/errors/internal-error.json
        - ./fixtures/v1/errors/invalid-input.json
        - ./fixtures/v1/errors/invalid-transition.json
        - ./fixtures/v1/errors/not-found.json
        - ./fixtures/v1/errors/service-unavailable.json
        - ./fixtures/v1/errors/unauthenticated.json
      required: [error, code, message, retryable, request_id]
      properties:
        error:
          type: string
          deprecated: true
          description: Version-1 compatibility alias for `message`.
        code:
          type: string
          description: Stable machine-readable classification.
          enum:
            - not_found
            - conflict
            - forbidden
            - invalid_input
            - invalid_transition
            - internal_error
            - service_unavailable
            - unauthenticated
        message:
          type: string
          description: Redacted human-readable explanation.
        retryable:
          type: boolean
          description: Whether retrying the unchanged request may succeed later.
        request_id:
          type: string
          description: Correlation ID also returned in the `X-Request-ID` header.
