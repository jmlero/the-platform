          type: string
        result_summary:
          type: string
        lease_expires_at:
          type: integer
          format: int64
        started_at:
          type: integer
          format: int64
        finished_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    Decision:
      type: object
      required:
        - id
        - task_id
        - question
        - options
        - recommendation
        - status
        - answer
        - created_at
      properties:
        id:
          type: string
        task_id:
          type: string
        run_id:
          type: string
        plan_revision_id:
          type: string
        question:
          type: string
        options:
          type: array
