openapi: 3.1.0
info:
  title: Deck Agent API
  version: 1.0.0
  description: |-
    Work-control API for creating and inspecting work, claiming tasks, submitting
    plans, requesting human decisions, reporting progress, and attaching evidence.

    Protocol conventions for major version 1:

    - `/api/v1` is the transport major version. Additive fields and capability
      identifiers do not change that version; incompatible semantics require `/api/v2`.
    - Fields named `*_at`, `now`, and `server_time` are UTC Unix timestamps in
      milliseconds. Durations explicitly named `*_seconds` are integer seconds.
    - Clients may send `X-Request-ID`. Deck echoes an accepted value or creates
      one, returns it in every response, and includes it in structured API errors.
    - Claim and run-mutation operations accept `Idempotency-Key`. A supplied key
      is required and scoped to project, caller identity, and operation; an exact replay returns
      the original successful result, while reuse with different input is a conflict.
      Deck generates a one-shot key when legacy clients omit the header, but only
      a caller-supplied stable key makes a lost response safely replayable.
    - API errors have stable `code`, `message`, `retryable`, and `request_id` fields.
      The `error` string remains a compatibility alias for `message` in version 1.
    - Operations that advertise pagination use a bounded `limit`, an opaque
      `cursor`, and an object containing `items` and optional `next_cursor`.
      Clients must not interpret cursor contents. Existing array responses are
      unpaginated unless their operation advertises a paginated capability.
    - Capability identifiers are additive. Clients must require only capabilities
      needed for the behavior they are about to enable.
    - Service operations with `x-capability` use an opaque Bearer credential when Deck
      service authentication is configured. The credential resolves to one stable
      service identity with explicit project and capability grants. Bearer tokens
      must travel only over a protected transport and are never accepted in URLs.
      Operator operations instead require an operator session, plus CSRF protection
      for mutations; their security scheme is declared on each operation.
servers:
  - url: http://localhost:8080/api/v1
    description: Local Deck
tags:
  - name: Provider
  - name: Workspace
  - name: Tasks
  - name: Agents
  - name: Runs
  - name: Decisions
  - name: Events
  - name: Channels
  - name: Operations
  - name: Context
  - name: Workloads

paths:
  /operator/projects:
    get:
      tags: [Workspace]
      operationId: listProjectChannels
      security: [{operatorSession: []}]
      summary: List projects with their channels and repository association
      responses:
        "200":
          description: Project workspaces, including historical channels
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/ProjectChannel"}}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
    post:
      tags: [Workspace]
      operationId: createProjectChannel
      security: [{operatorSession: []}]
      summary: Create a project channel and request repository association
      description: Requires CSRF. Repeating the same repository and branch recovers the workspace. Does not grant credentials or enable execution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository, base_branch]
              properties:
                repository: {type: string, description: GitHub owner/repository}
                base_branch: {type: string}
      responses:
        "201":
          description: Created or existing workspace
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectChannel"}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /operator/tasks/{id}/accept:
    post:
      tags: [Tasks]
      operationId: acceptTaskResult
      security: [{operatorSession: []}]
      summary: Accept a verified completed result as human Done
      description: >-
        Requires CSRF and the current task version. The actor comes from the operator
        session. Stores acceptance of the latest completed run without changing v1
        execution status. Identical retries using the accepted version return the
        same task. Stale evidence, changed criteria, active work and archived tasks
        cannot be accepted. source_available is a human attestation that code is on
        the base branch, not automatic Git merge proof. Requeue clears acceptance.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, minimum: 1}
                source_available: {type: boolean, default: false}
      responses:
        "200":
          description: Accepted task
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /operator/tasks/{id}/dependencies:
    put:
      tags: [Tasks]
      operationId: setTaskDependencies
      security: [{operatorSession: []}]
      summary: Set same-project prerequisites on a current Backlog draft
      description: >-
        Requires CSRF and current version. Rejects self references, cycles and
        cross-project dependencies. Ready discovery and direct claim both wait for
        accepted prerequisites with current evidence. Code prerequisites additionally
        need source_available confirmation. Existing active run inputs are unchanged.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, depends_on]
              properties:
                version: {type: integer, minimum: 1}
                depends_on: {type: array, maxItems: 50, items: {type: string}}
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /operator/channels/{id}/invocations:
    post:
      tags: [Channels]
      operationId: invokeConversationAgent
      security: [{operatorSession: []}]
      summary: Record an explicit request to a configured conversation agent
      description: >-
        Requires CSRF. The agent must be registered with an installation ID and
        conversation.invoke.{project_id} capability for the channel project.
        Exactly one of body or message_id is
        required. A new body starts a thread or appends to thread_id; message_id
        requests the agent for an existing human message. The first invocation
        selects the agent for the thread. Later invocations must use that agent.
        request_id replays the identical message and invocation without duplicates;
        using it for different content conflicts. Recording a request does not
        authorize a task or imply that a conversation worker has executed it.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, request_id]
              properties:
                agent_id: {type: string, minLength: 1}
                request_id: {type: string, minLength: 1, maxLength: 128}
                thread_id: {type: string}
                message_id: {type: string}
                body: {type: string}
      responses:
        "201":
          description: Canonical thread and invoked message
          content:
            application/json:
              schema:
                type: object
                required: [thread, message]
                properties:
                  thread: {$ref: "#/components/schemas/ConversationThread"}
                  message: {$ref: "#/components/schemas/ChannelMessage"}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/InvalidInput"}

  /operator/channels/{id}/threads:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Channels]
      operationId: listConversationThreads
      security: [{operatorSession: []}]
      summary: List durable threads in root-message append order
      responses:
        "200":
          description: Threads with canonical task links; no execution is invoked
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ConversationThread"}}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Channels]
      operationId: createConversationThread
      security: [{operatorSession: []}]
      summary: Start or recover a thread from an existing channel message
      description: >-
        Naturally idempotent by canonical message identity. If the message already
        belongs to a thread, returns that thread, including when the message is a reply.
        New threads emit conversation.thread.created with project, channel, thread,
        and root message IDs. No task or model invocation is created. Requires CSRF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root_message_id]
              properties:
                root_message_id: {type: string, minLength: 1}
      responses:
        "201":
          description: New or existing durable thread
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConversationThread"}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}

  /operator/threads/{id}:
    get:
      tags: [Channels]
      operationId: getConversationThread
      security: [{operatorSession: []}]
      summary: Recover a thread by its stable identity from any operator session
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Canonical thread and task links, including archived tasks
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConversationThread"}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "404": {$ref: "#/components/responses/NotFound"}

  /operator/threads/{id}/messages:
    get:
      tags: [Channels]
      operationId: listConversationThreadMessages
      security: [{operatorSession: []}]
      summary: Page the root and replies in durable append order
      description: >-
        Use next_cursor as cursor to continue. Cursors are exclusive and must name
        a message in this thread. Append replies through the existing channel
        messages endpoint with thread_id; channel history continues to include all
        messages. Message bodies and IDs are not copied into a second history.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200":
          description: Root and replies
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ChannelMessage"}}
                  next_cursor: {type: string}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}

  /operator/threads/{id}/tasks:
    post:
      tags: [Channels]
      operationId: linkConversationTask
      security: [{operatorSession: []}]
      summary: Link an existing same-project task to its originating thread
      description: >-
        A thread can originate multiple tasks; a task has one immutable originating
        thread. Repeating the same pair succeeds without another event. A different
        origin conflicts. Emits conversation.task.linked with the canonical task
        and thread IDs. Does not change task status, context, budget, version, or
        authority. Linked drafts must be archived instead of deleted. Requires CSRF.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id]
              properties:
                task_id: {type: string, minLength: 1}
      responses:
        "204": {description: Task linked or identical link already present}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/InvalidInput"}

  /operator/tasks/{id}/thread:
    get:
      tags: [Channels]
      operationId: getTaskConversationThread
      security: [{operatorSession: []}]
      summary: Recover the originating thread for a task
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Task origin retained across restart and archive
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConversationThread"}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "404": {description: Task does not exist or has no originating thread}

  /operator/tasks/{id}:
    delete:
      tags: [Tasks]
      operationId: deleteDraftTask
      summary: Permanently delete an unexecuted backlog draft
      description: Requires the current task version. Drafts linked to channel promotion or workload invocation must be archived to preserve replay identity. Deletes draft events and emits a task.deleted event with the removed ID in its payload. Executed, archived, ready and active tasks cannot be deleted.
      security: [{operatorSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, minimum: 1}
      responses:
        "204": {description: Draft deleted}
        "401": {description: Operator authentication required}
        "403": {description: CSRF validation failed}
        "404": {description: Task not found, including a previously deleted draft}
        "409": {description: Stale version or task cannot be deleted}
        "422": {description: Invalid request}
  /operator/tasks/{id}/archive:
    put:
      tags: [Tasks]
      operationId: setTaskArchived
      summary: Archive or restore inactive work without changing its outcome
      description: Requires the current task version and no active run. Ready work must first return to backlog. Archive retains task/run identities, PR evidence and history; archived tasks cannot be edited, moved or claimed until restored. Operator bootstrap and task inspection retain archived records. Restoring does not authorize execution.
      security: [{operatorSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, archived]
              properties:
                version: {type: integer, minimum: 1}
                archived: {type: boolean}
      responses:
        "200":
          description: Task with updated archive state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "401": {description: Operator authentication required}
        "403": {description: CSRF validation failed}
        "404": {description: Task not found}
        "409": {description: Stale version or work is ready or active}
        "422": {description: Invalid request}
  /operator/provider:
    get:
      tags: [Provider]
      operationId: getOperatorProviderInfo
      summary: Discover protocol capabilities and readiness using an operator session
      security: [{operatorSession: []}]
      responses:
        "200":
          description: Same safe provider information as the service discovery endpoint
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderInfo"}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /operator/projects/{project}/workloads:
    get:
      tags: [Workloads]
      operationId: discoverWorkloads
      x-capability: workload.discover
      description: "Discover safe installed profiles. Expired catalogs return an empty list; metadata grants no authority."
      security: [{operatorSession: []}]
      parameters:
        - {name: project, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Successful workload operation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkloadCatalog"}
        "401":
          description: Authentication required
        "403":
          description: Not authorized
        "409":
          description: Profile expired, unavailable, owned by another service or idempotency conflict
        "422":
          description: Invalid input or missing authority
  /operator/projects/{project}/workloads/invoke:
    post:
      tags: [Workloads]
      operationId: invokeWorkload
      x-capability: workload.invoke
      description: "Create one Ready task with explicit authority, budgets and a pinned profile. Idempotency-Key is required: exact retries replay the original task even after profile withdrawal, changed payloads conflict. Inspect task/runs, cancel and download results using existing operator APIs."
      security: [{operatorSession: []}]
      parameters:
        - {name: project, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkloadInvocation"}
      responses:
        "201":
          description: Successful workload operation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "401":
          description: Authentication required
        "403":
          description: Not authorized
        "409":
          description: Profile expired, unavailable, owned by another service or idempotency conflict
        "422":
          description: Invalid input or missing authority
  /projects/{project}/workloads:
    put:
      tags: [Workloads]
      operationId: publishWorkloads
      x-capability: workload.publish
      description: "Marina publishes its complete installed catalog with a validity of at most five minutes. Project-scoped service identity owns this projection; an empty list withdraws all profiles. Repeated publication replaces the same projection."
      security: [{serviceBearer: []}]
      parameters:
        - {name: project, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkloadCatalog"}
      responses:
        "200":
          description: Successful workload operation
        "401":
          description: Authentication required
        "403":
          description: Not authorized
        "409":
          description: Profile expired, unavailable, owned by another service or idempotency conflict
        "422":
          description: Invalid input or missing authority
  /operator/projects/{project}/repository:
    get:
      tags: ["Context"]
      operationId: "getOperatorRepository"
      description: "Safe Marina-confirmed binding and latest association request."
      security: [{"operatorSession": []}]
      parameters: [{"name": "project", "in": "path", "required": true, "schema": {"type": "string"}}]
      responses:
        200:
          description: "Repository association"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryRequest"
        401:
          description: "Authentication required"
        403:
          description: "Project or capability not authorized"
        409:
          description: "Revision conflict"
        422:
          description: "Invalid association"
    put:
      tags: ["Context"]
      operationId: "requestRepository"
      description: "Request association within the installed GitHub origin. Retries of the same expected revision and payload are idempotent. Pending requests preserve the previous confirmed binding."
      security: [{"operatorSession": []}]
      parameters: [{"name": "project", "in": "path", "required": true, "schema": {"type": "string"}}]
      responses:
        200:
          description: "Repository association"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryRequest"
        401:
          description: "Authentication required"
        403:
          description: "Project or capability not authorized"
        409:
          description: "Revision conflict"
        422:
          description: "Invalid association"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryRequestInput"
  /projects/{project}/repository:
    get:
      tags: ["Context"]
      operationId: "getRepositoryRequest"
      description: "Read the operator association request for reconciliation."
      security: [{"serviceBearer": []}]
      parameters: [{"name": "project", "in": "path", "required": true, "schema": {"type": "string"}}]
      x-capability: repository.read
      responses:
        200:
          description: "Repository association"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryRequest"
        401:
          description: "Authentication required"
        403:
          description: "Project or capability not authorized"
        409:
          description: "Revision conflict"
        422:
          description: "Invalid association"
  /projects/{project}/repository/result:
    put:
      tags: ["Context"]
      operationId: "recordRepositoryResult"
      description: "Publish a safe confirmation or rejection from Marina. Exact retries are idempotent; stale request revisions conflict."
      security: [{"serviceBearer": []}]
      parameters: [{"name": "project", "in": "path", "required": true, "schema": {"type": "string"}}]
      x-capability: repository.write
      responses:
        200:
          description: "Repository association"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  recorded:
                    type: "boolean"
        401:
          description: "Authentication required"
        403:
          description: "Project or capability not authorized"
        409:
          description: "Revision conflict"
        422:
          description: "Invalid association"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryResult"
  /operator/projects/{project}/context/sources:
    get:
      tags: ["Context"]
      operationId: "listOperatorContextSources"
      description: "Version history for explicitly registered project sources."
      security: [{"operatorSession": []}]
      parameters: [{"name": "project", "in": "path", "required": true, "schema": {"type": "string"}}]
      responses:
        "200":
          description: "Context result"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ContextSource"
        "401":
          description: "Authentication required"
        "403":
          description: "Project or capability not authorized"
        "404":
          description: "Resource not found"
        "409":
          description: "Revision conflict"
        "422":
          description: "Invalid context selection"
    put:
      tags: ["Context"]
      operationId: "putContextSource"
      description: "Create or revise a source using expected_revision; Git and approved decisions retain their canonical owners."
      security: [{"operatorSession": []}]
      parameters: [{"name": "project", "in": "path", "required": true, "schema": {"type": "string"}}]
      responses:
        "200":
          description: "Context result"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ContextSource"
        "401":
          description: "Authentication required"
        "403":
          description: "Project or capability not authorized"
        "404":
          description: "Resource not found"
        "409":
          description: "Revision conflict"
        "422":
          description: "Invalid context selection"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ContextSourceInput"
  /operator/projects/{project}/context/sources/{source}/{revision}/revoke:
    post:
      tags: ["Context"]
      operationId: "revokeContextSource"
      description: "Revoke this exact revision. Active consumers must stop using it; saved references remain immutable."
      security: [{"operatorSession": []}]
      parameters: [{"name": "project", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "source", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "revision", "in": "path", "required": true, "schema": {"type": "string"}}]
      responses:
        "200":
          description: "Context result"
          content:
            "application/json":
              schema:
                type: "object"
        "401":
          description: "Authentication required"
        "403":
          description: "Project or capability not authorized"
        "404":
          description: "Resource not found"
        "409":
          description: "Revision conflict"
        "422":
          description: "Invalid context selection"
  /operator/tasks/{id}/context:
    get:
      tags: ["Context"]
      operationId: "getOperatorTaskContext"
      description: "Inspect context selected when the task was authorized. New project revisions cannot enter it silently."
      security: [{"operatorSession": []}]
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}]
      responses:
        "200":
          description: "Context result"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResolvedContext"
        "401":
          description: "Authentication required"
        "403":
          description: "Project or capability not authorized"
        "404":
          description: "Resource not found"
        "409":
          description: "Revision conflict"
        "422":
          description: "Invalid context selection"
  /operator/runs/{id}/context:
    get:
      tags: ["Context"]
      operationId: "getOperatorRunContext"
      description: "Inspect the original run selection even after a task is edited or retried."
      security: [{"operatorSession": []}]
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}]
      responses:
        "200":
          description: "Context result"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResolvedContext"
        "401":
          description: "Authentication required"
        "403":
          description: "Project or capability not authorized"
        "404":
          description: "Resource not found"
        "409":
          description: "Revision conflict"
        "422":
          description: "Invalid context selection"
  /projects/{project}/context/sources:
    get:
      tags: ["Context"]
      operationId: "listContextSources"
      description: "Read project source revisions and revocation state."
      security: [{"serviceBearer": []}]
