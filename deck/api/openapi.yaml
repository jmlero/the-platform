            schema:
              allOf:
                - $ref: "#/components/schemas/RunGuard"
                - $ref: "#/components/schemas/EvidenceInput"
      responses:
        "201":
          description: Evidence recorded or exact retry replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evidence" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /runs/{runId}/operations:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Operations]
      operationId: reportOperationalState
      x-capability: operation.report
      security:
        - serviceBearer: []
      summary: Report provider-neutral rollout, observation, rollback, and policy state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RunGuard"
                - $ref: "#/components/schemas/OperationalStateInput"
      responses:
        "200":
          description: Current operational state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalState" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /conversation/invocations:
    get:
      tags: [Channels]
      operationId: listConversationInvocations
      x-capability: conversation.invocation.list
      security:
        - serviceBearer: []
      summary: List explicit agent invocations in durable event order
      description: >-
        after_id is an exclusive event cursor. The feed includes invocations of
        older channel messages, which retain their original message IDs and
        timestamps. A service identity must hold this capability and the exact
        project grant. Every item contains the canonical invoked message.
      parameters:
        - { name: project_id, in: query, required: true, schema: { type: string } }
        - { name: after_id, in: query, required: true, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        "200":
          description: Invocations in ascending event order, at most 100 per page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ConversationDispatch" } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidInput" }

  /conversation/questions:
    post:
      tags: [Channels]
      operationId: ensureConversationQuestion
      x-capability: conversation.question.write
      security: [{serviceBearer: []}]
      summary: Record or recover one engine question in its invoked thread
      description: >-
        Requires the exact project grant for the invoked message. The pair of
        invocation_message_id and question_id is replay safe. A changed question
        conflicts. The response includes the canonical answer, if already given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invocation_message_id, agent_id, question_id, text]
              properties:
                invocation_message_id: {type: string}
                agent_id: {type: string}
                question_id: {type: string}
                text: {type: string}
                choices: {type: array, items: {type: string}}
      responses:
        "200":
          description: Canonical question and current answer state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConversationQuestion"}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/InvalidInput"}

  /conversation/outcomes:
    post:
      tags: [Channels]
      operationId: publishConversationOutcome
      x-capability: conversation.outcome.publish
      security: [{serviceBearer: []}]
      summary: Publish one terminal conversation result to its originating thread
      description: >-
        Requires the exact project grant for the invoked human message and its
        selected agent. A completed turn may create one linked Backlog draft;
        this route does not create Ready work. Ready delegation uses the separate
        conversation.task.delegate route.
        A follow-up must name a completed task from the same originating thread;
        it creates a new task without changing the original. Exact retries return
        the original message and task; changed payloads conflict. The agent
        cannot grant itself execution authority through its text output.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invocation_message_id, agent_id, status, body, result_digest]
              properties:
                invocation_message_id: {type: string}
                agent_id: {type: string}
                status: {type: string, enum: [completed, blocked]}
                body: {type: string, minLength: 1, maxLength: 8192}
                result_digest: {type: string}
                task: {$ref: "#/components/schemas/CreateTask"}
                followup_task_id: {type: string}
      responses:
        "200":
          description: Canonical published outcome
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConversationOutcome"}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/InvalidInput"}

  /conversation/delegations:
    post:
      tags: [Channels]
      operationId: publishReadyConversationDelegation
      x-capability: conversation.task.delegate
      security: [{serviceBearer: []}]
      summary: Publish one explicit delegation as a Ready repository task
      description: >-
        Requires a project-scoped service grant, the exact invoked human message,
        the current installed repository/v1 profile digest, its bounded budget,
        acceptance criteria and required source/PR authority. Creates one task
        and one linked thread reply atomically. Exact retries return the same
        identities; changed requests conflict. A follow-up can target only a
        completed task originating in the same thread.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invocation_message_id, agent_id, status, body, result_digest, profile_id, profile_digest, task]
              properties:
                invocation_message_id: {type: string}
                agent_id: {type: string}
                status: {type: string, enum: [completed]}
                body: {type: string, minLength: 1, maxLength: 8192}
                result_digest: {type: string}
                profile_id: {type: string, enum: [repository/v1]}
                profile_digest: {type: string}
                task: {$ref: "#/components/schemas/CreateTask"}
                followup_task_id: {type: string}
      responses:
        "200":
          description: Canonical published task and thread reply
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConversationOutcome"}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/InvalidInput"}

  /operator/threads/{id}/questions:
    get:
      tags: [Channels]
      operationId: listThreadConversationQuestions
      security: [{operatorSession: []}]
      summary: List persisted clarification questions for a thread
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Questions in creation order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ConversationQuestion"}}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /operator/conversation/questions/{id}/answer:
    post:
      tags: [Channels]
      operationId: answerConversationQuestion
      security: [{operatorSession: []}]
      summary: Attach one operator answer to its exact pending question
      description: >-
        Requires CSRF. The answer becomes a human message in the originating
        thread. Replaying the same request_id and answer returns the same
        message; another answer conflicts. It does not authorize a task.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer, request_id]
              properties:
                answer: {type: string, minLength: 1, maxLength: 2000}
                request_id: {type: string, minLength: 1, maxLength: 128}
      responses:
        "200":
          description: Answered question
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConversationQuestion"}
        "401": {$ref: "#/components/responses/AuthenticationRequired"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/InvalidInput"}

  /channels:
    get:
      tags: [Channels]
      operationId: listProjectChannels
      x-capability: channel.list
      security:
        - serviceBearer: []
      summary: List agent-native conversation channels without treating chat as work authority
      parameters:
        - { name: project_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Project channels
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /channels/{channelId}/messages:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Channels]
      operationId: listChannelMessages
      x-capability: channel.message.list
      security:
        - serviceBearer: []
      summary: List channel messages in append order with canonical references
      description: >-
        Pages follow durable append order, including equal timestamps. Pass next_cursor
        as cursor to continue. Cursors are opaque, exclusive, and channel-scoped.
        The operator endpoint uses the same pagination. Appends emit a durable
        channel.message.created event with project_id, channel_id, and message_id.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Channel messages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ChannelMessage" }
                  next_cursor: { type: string }
        "422": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Channels]
      operationId: appendChannelMessage
      x-capability: channel.message.append
      security:
        - serviceBearer: []
      summary: Append a message which carries references but no ambient execution authority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                thread_id: {type: string, description: Optional existing thread in this channel. Applies to the operator endpoint too.}
                references: { $ref: "#/components/schemas/CanonicalReferences" }
      responses:
        "201":
          description: Message appended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelMessage" }
        "422": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /decisions:
    get:
      tags: [Decisions]
      operationId: listDecisions
      x-capability: decision.list
      security:
        - serviceBearer: []
      summary: List human decision requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, answered, cancelled]
      responses:
        "200":
          description: Decision list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Decision"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /decisions/{decisionId}/answer:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Decisions]
      operationId: answerDecision
      x-capability: decision.answer
      security:
        - serviceBearer: []
      summary: Record the human answer to a pending decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer:
                  type: string
      responses:
        "200":
          description: Answered decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /decisions/{decisionId}:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Decisions]
      operationId: getDecision
      x-capability: decision.inspect
      security:
        - serviceBearer: []
      summary: Get one decision so an agent can wait for its answer
      responses:
        "200":
          description: Decision state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /events:
    get:
      tags: [Events]
      operationId: listEvents
      x-capability: event.list
      security:
        - serviceBearer: []
      summary: List durable workspace events
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: after_id
          in: query
          description: Return events newer than this event ID in ascending order
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /events/stream:
    get:
      tags: [Events]
      operationId: streamEvents
      x-capability: event.stream
      security:
        - serviceBearer: []
      summary: Subscribe to live durable events and agent heartbeats
      parameters:
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Server-Sent Event stream with JSON-encoded Event values
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    operatorSession:
      type: apiKey
      in: cookie
      name: deck_operator_session
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        High-entropy service credential resolved to a stable identity with
        explicit project and capability grants. Deck stores only SHA-256
        fingerprints; Marina loads the token value from a file reference.

  headers:
    RequestId:
      description: Correlates this response with service logs and structured errors.
      schema:
        type: string
        maxLength: 128
    WWWAuthenticate:
      description: Bearer authentication challenge for the Deck service API.
      schema:
        type: string

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller correlation ID containing letters, digits, `-`, `_`, `.`, or `:`.
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Stable caller-generated key for replaying one claim or run mutation.
        Keys are scoped to the canonical project, caller identity, and operation.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]+$'
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string

  responses:
    AuthenticationRequired:
      description: A valid Deck service credential is required
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          $ref: "#/components/headers/WWWAuthenticate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The service identity lacks the required project or capability grant
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: The service authorization policy cannot be loaded safely
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested resource does not exist
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >-
        The resource changed, is no longer available, or the Idempotency-Key was
        already used with a different request payload
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidInput:
      description: Invalid input or state transition
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    WorkloadProfile:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "digest",
          "harness",
          "authority",
          "max_tokens",
          "budget_minutes",
          "min_attempts",
          "tools",
          "context_kinds"
        ],
        "properties": {
          "id": {
            "type": "string",
            "enum": [
              "repository/v1",
              "diagnostic-analysis/v1"
            ]
          },
          "digest": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "harness": {
            "type": "string"
          },
          "authority": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "max_tokens": {
            "type": "integer",
            "minimum": 1
          },
          "budget_minutes": {
            "type": "integer",
            "minimum": 1
          },
          "min_attempts": {
            "type": "integer",
            "minimum": 1
          },
          "tools": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "read_context_source"
              ]
            }
          },
          "context_kinds": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      }
    WorkloadCatalog:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "profiles",
          "expires_at"
        ],
        "properties": {
          "profiles": {
            "type": "array",
            "maxItems": 2,
            "items": {
              "$ref": "#/components/schemas/WorkloadProfile"
            }
          },
          "expires_at": {
            "type": "integer"
          }
        },
        "examples": [
          {
            "$ref": "./fixtures/v1/workloads.json"
          }
        ]
      }
    WorkloadInvocation:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "profile_id",
          "profile_digest",
          "task"
        ],
        "properties": {
          "profile_id": {
            "type": "string"
          },
          "profile_digest": {
            "type": "string"
          },
          "task": {
            "$ref": "#/components/schemas/CreateTask"
          }
        }
      }
    ContextReference:
      type: "object"
      required: ["id", "revision", "digest"]
      properties:
        id:
          type: "string"
        revision:
          type: "integer"
          minimum: 1
        digest:
          type: "string"
          pattern: "^sha256:[a-f0-9]{64}$"
    RepositoryBinding:
      type: "object"
      required: ["version", "repository", "clone_url", "base_branch"]
      properties:
        version:
          type: "integer"
          minimum: 1
        repository:
          type: "string"
        clone_url:
          type: "string"
          format: "uri"
        base_branch:
          type: "string"
    RepositoryRequestInput:
      type: "object"
      required: ["expected_revision", "expected_binding_version", "repository", "base_branch"]
      properties:
        expected_revision:
          type: "integer"
          minimum: 0
        expected_binding_version:
          type: "integer"
          minimum: 0
        repository:
          type: "string"
          pattern: "^[A-Za-z0-9_-][A-Za-z0-9_.-]{0,99}/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,99}$"
        base_branch:
          type: "string"
          maxLength: 200
    RepositoryRequest:
      example:
        $ref: ./fixtures/v1/repository.json
      type: "object"
      required: ["expected_revision", "expected_binding_version", "repository", "base_branch", "revision", "status"]
      properties:
        expected_revision:
          type: "integer"
          minimum: 0
        expected_binding_version:
          type: "integer"
          minimum: 0
        repository:
          type: "string"
          pattern: "^[A-Za-z0-9_-][A-Za-z0-9_.-]{0,99}/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,99}$"
        base_branch:
          type: "string"
          maxLength: 200
        revision:
          type: "integer"
        status:
          type: "string"
          enum: ["", "pending", "connected", "rejected"]
        reason:
          type: "string"
        binding:
          $ref: "#/components/schemas/RepositoryBinding"
    RepositoryResult:
      type: "object"
      required: ["request_revision", "status"]
      properties:
        request_revision:
          type: "integer"
          minimum: 1
        status:
          type: "string"
          enum: ["connected", "rejected"]
        reason:
          type: "string"
          maxLength: 500
        binding:
          $ref: "#/components/schemas/RepositoryBinding"
    ContextSourceInput:
      type: "object"
      additionalProperties: false
      required: ["id", "kind", "title"]
      properties:
        id:
          type: "string"
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,79}$"
        expected_revision:
          type: "integer"
          minimum: 0
          default: 0
        kind:
          type: "string"
          enum: ["instruction", "goal", "document", "git", "decision"]
        title:
          type: "string"
          minLength: 1
          maxLength: 200
        content:
          type: "string"
          maxLength: 16384
        reference:
          type: "string"
          description: "Canonical approved Deck decision ID; never an arbitrary URL."
        source_revision:
          type: "string"
          description: "Exact Git commit or the decision\u2019s immutable plan revision."
        path:
          type: "string"
          description: "Safe repository-relative regular text file for Git sources."
        trust:
          type: "string"
          enum: ["data", "guidance"]
          default: "data"
        state:
