openapi: 3.1.0
info:
  title: AppDeck Agent API
  version: 1.0.0
  description: |-
    Work-control API for creating and inspecting work, claiming tasks, submitting
    plans, requesting human decisions, reporting progress, and attaching evidence.

    Protocol conventions for major version 1:

    - `/api/v1` is the transport major version. Additive fields and capability
      identifiers do not change that version; incompatible semantics require `/api/v2`.
    - Fields named `*_at`, `now`, and `server_time` are UTC Unix timestamps in
      milliseconds. Durations explicitly named `*_seconds` are integer seconds.
    - Clients may send `X-Request-ID`. AppDeck echoes an accepted value or creates
      one, returns it in every response, and includes it in structured API errors.
    - Claim and run-mutation operations accept `Idempotency-Key`. A supplied key
      is required and scoped to project, caller identity, and operation; an exact replay returns
      the original successful result, while reuse with different input is a conflict.
      AppDeck generates a one-shot key when legacy clients omit the header, but only
      a caller-supplied stable key makes a lost response safely replayable.
    - API errors have stable `code`, `message`, `retryable`, and `request_id` fields.
      The `error` string remains a compatibility alias for `message` in version 1.
    - Operations that advertise pagination use a bounded `limit`, an opaque
      `cursor`, and an object containing `items` and optional `next_cursor`.
      Clients must not interpret cursor contents. Existing array responses are
      unpaginated unless their operation advertises a paginated capability.
    - Capability identifiers are additive. Clients must require only capabilities
      needed for the behavior they are about to enable.
    - Operations with `x-capability` use an opaque Bearer credential when AppDeck
      service authentication is configured. The credential resolves to one stable
      service identity with explicit project and capability grants. Bearer tokens
      must travel only over a protected transport and are never accepted in URLs.
servers:
  - url: http://localhost:8080/api/v1
    description: Local AppDeck
tags:
  - name: Provider
  - name: Workspace
  - name: Tasks
  - name: Agents
  - name: Runs
  - name: Decisions
  - name: Events
  - name: Channels
  - name: Operations

paths:
  /operator/tasks/{id}/artifacts/{digest}:
    get:
      tags: [Tasks]
      operationId: downloadOperatorEvidenceArtifact
      summary: Download registered verification bytes through the operator session
      description: Verifies the task ledger reference, configured artifact origin and SHA-256 digest before returning bytes. Requires an operator session when operator authentication is configured.
      security:
        - operatorSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: digest, in: path, required: true, schema: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}}
      responses:
        "200":
          description: Integrity-checked verification result, maximum 4 MiB
          content:
            application/json:
              schema: {type: object}
        "401": {description: Operator authentication required}
        "404": {description: No registered downloadable artifact}
        "502": {description: Artifact unavailable or failed integrity verification}
        "503": {description: Artifact credentials or trust configuration unavailable}
  /provider:
    get:
      tags: [Provider]
      operationId: getProviderInfo
      x-capability: provider.info
      security:
        - serviceBearer: []
      summary: Discover protocol compatibility and readiness
      description: >-
        This read-only operation remains available when the canonical store is
        unavailable so clients can distinguish incompatibility from degraded readiness.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Provider identity, protocol, capabilities, time, and readiness
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderInfo"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /bootstrap:
    get:
      tags: [Workspace]
      operationId: getBootstrap
      summary: Get the current workspace snapshot
      responses:
        "200":
          description: Tasks, agents, pending decisions, and recent events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"

  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      x-capability: work.ready.list
      security:
        - serviceBearer: []
      summary: List all tasks in priority order
      parameters:
        - name: status
          in: query
          description: Optional exact task-status filter; Marina uses `ready` for work discovery.
          schema:
            $ref: "#/components/schemas/TaskStatus"
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a backlog or ready task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "422":
          $ref: "#/components/responses/InvalidInput"

  /tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [Tasks]
      operationId: getTask
      x-capability: work.inspect
      security:
        - serviceBearer: []
      summary: Get a task with its runs, events, decisions, and artifacts
      responses:
        "200":
          description: Complete task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Update the durable task definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTask"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          $ref: "#/components/responses/Conflict"

  /tasks/{taskId}/move:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: moveTask
      summary: Perform a guarded manual task transition
      description: >-
        Intended for backlog release and requeue actions. Active execution states
        are controlled by run operations and cannot be moved manually.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/TaskStatus"
      responses:
        "200":
          description: Moved task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidInput"

  /tasks/{taskId}/claim:
    parameters:
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Runs]
      operationId: claimTask
      x-capability: work.claim.atomic
      security:
        - serviceBearer: []
      summary: Atomically claim a ready task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, expected_task_version]
              properties:
                agent_id:
                  type: string
                expected_task_version:
                  type: integer
                  minimum: 1
                lease_seconds:
                  type: integer
                  minimum: 1
                  default: 30
      responses:
        "201":
          description: New planning run with an exclusive lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /claims/{idempotencyKey}:
    get:
      tags: [Runs]
      operationId: lookupClaim
      x-capability: work.claim.lookup
      security:
        - serviceBearer: []
      summary: Recover the exact committed claim result by its stable key
      parameters:
        - name: idempotencyKey
          in: path
          required: true
          schema: { type: string }
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Original claimed run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /runs:
    get:
      tags: [Runs]
      operationId: listAssignedRuns
      x-capability: run.assigned.list
      security:
        - serviceBearer: []
      summary: Discover active runs assigned to one stable logical agent
      parameters:
        - { name: project_id, in: query, required: true, schema: { type: string } }
        - { name: agent_id, in: query, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200":
          description: Assigned active runs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [run, task]
                      properties:
                        run: { $ref: "#/components/schemas/Run" }
                        task: { $ref: "#/components/schemas/Task" }
                  next_cursor: { type: string }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /agents:
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List known agents and their presence
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      tags: [Agents]
      operationId: registerAgent
      x-capability: agent.register
      security:
        - serviceBearer: []
      summary: Register or reconnect an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAgent"
      responses:
        "201":
          description: Registered agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{runId}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Runs]
      operationId: heartbeatRun
      x-capability: run.lease.renew
      security:
        - serviceBearer: []
      summary: Renew an active run lease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, expected_version, fence_token]
              properties:
                agent_id:
                  type: string
                expected_version: { type: integer, format: int64, minimum: 1 }
                fence_token: { type: integer, format: int64, minimum: 1 }
                lease_seconds:
                  type: integer
                  minimum: 1
                  default: 30
      responses:
        "204":
          description: Lease renewed
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{runId}/plan:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Runs]
      operationId: submitPlan
      x-capability: run.plan.submit
      security:
        - serviceBearer: []
      summary: Submit the plan for an active planning run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, expected_version, fence_token, plan]
              properties:
                agent_id: { type: string }
                expected_version: { type: integer, format: int64, minimum: 1 }
                fence_token: { type: integer, format: int64, minimum: 1 }
                plan:
                  type: string
                context_digest: { type: string }
                risk_class: { type: string, enum: [low, medium, high, critical] }
                verification_strategy: { type: string }
                expected_side_effects:
                  type: array
                  items: { type: string }
                rollback_approach: { type: string }
                source_revision:
                  type: string
                  description: Optional fixed output revision for the evidence gate. For source-changing work whose output does not exist yet, omit it and bind the base revision in context; the execution provider must verify the current published head before completion.
                policy_version: { type: string }
                require_approval:
                  type: boolean
                  default: true
                decision_expires_at: { type: integer, format: int64 }
                decision_evidence: { type: string }
                estimated_cost_minor: { type: integer, format: int64, minimum: 0 }
                currency: { type: string, minLength: 3, maxLength: 3 }
                waiting_consequence: { type: string }
                rejecting_consequence: { type: string }
      responses:
        "200":
          description: Optional decision created for human approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan_revision:
                    $ref: "#/components/schemas/PlanRevision"
                  decision:
                    oneOf:
                      - $ref: "#/components/schemas/Decision"
                      - type: "null"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{runId}/progress:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Runs]
      operationId: reportProgress
      x-capability: run.progress.append
      security:
        - serviceBearer: []
      summary: Append a durable progress event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, expected_version, fence_token, message]
              properties:
                agent_id: { type: string }
                expected_version: { type: integer, format: int64, minimum: 1 }
                fence_token: { type: integer, format: int64, minimum: 1 }
                message:
                  type: string
                payload:
                  type: object
                  additionalProperties: true
      responses:
        "204":
          description: Progress recorded
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{runId}/start:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Runs]
      operationId: startRun
      x-capability: run.start
      security:
        - serviceBearer: []
      summary: Resume a run after its plan is approved
      description: >-
        The control plane verifies that the latest plan decision is answered and
        matches the recommended approval option before starting execution.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunGuard" }
      responses:
        "204":
          description: Approved run started
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{runId}/verify:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Runs]
      operationId: beginVerification
      x-capability: run.verify
      security:
        - serviceBearer: []
      summary: Move a running attempt into verification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunGuard" }
      responses:
        "204":
          description: Run is verifying
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{runId}/complete:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Runs]
      operationId: completeRun
      x-capability: run.complete
      security:
        - serviceBearer: []
      summary: Complete a verified run with evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, expected_version, fence_token, summary, evidence_ids]
              properties:
                agent_id: { type: string }
                expected_version: { type: integer, format: int64, minimum: 1 }
                fence_token: { type: integer, format: int64, minimum: 1 }
                summary:
                  type: string
                evidence_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string }
                  description: IDs of current structured evidence records admitted for the active plan revision.
      responses:
        "204":
          description: Run completed and evidence artifact created
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{runId}/block:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Runs]
      operationId: blockRun
      x-capability: run.block
      security:
        - serviceBearer: []
      summary: Stop an active attempt and mark its task blocked
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, expected_version, fence_token, reason]
              properties:
                agent_id: { type: string }
                expected_version: { type: integer, format: int64, minimum: 1 }
                fence_token: { type: integer, format: int64, minimum: 1 }
                reason:
                  type: string
      responses:
        "204":
          description: Run and task marked blocked
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{runId}/commands:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [Runs]
      operationId: listRunCommands
      x-capability: command.list
      security:
        - serviceBearer: []
      summary: List durable commands after a per-run sequence cursor
      parameters:
        - { name: after_sequence, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200":
          description: Ordered command page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Command" } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /runs/{runId}/commands/{commandId}/ack:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/IdempotencyKey"
      - { name: commandId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Runs]
      operationId: acknowledgeRunCommand
      x-capability: command.ack
      security:
        - serviceBearer: []
      summary: Idempotently acknowledge, reject, or complete a durable command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RunGuard"
                - type: object
                  required: [status, result]
                  properties:
                    status: { type: string, enum: [acknowledged, rejected, completed] }
                    result: { type: string }
      responses:
        "204": { description: Command acknowledgement recorded }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /runs/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Events]
      operationId: appendRunEvent
      x-capability: event.append
      security:
        - serviceBearer: []
      summary: Append one ordered producer event with durable deduplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RunGuard"
                - type: object
                  required: [producer, producer_event_id, execution_id, sequence, type, message, occurred_at]
                  properties:
                    producer: { type: string }
                    producer_event_id: { type: string }
                    execution_id: { type: string }
                    sequence: { type: integer, format: int64, minimum: 1 }
                    type: { type: string }
                    message: { type: string }
                    payload: { type: object, additionalProperties: true }
                    occurred_at: { type: integer, format: int64 }
      responses:
        "204": { description: Event appended or exact replay accepted }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /runs/{runId}/evidence:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Runs]
      operationId: recordRunEvidence
      x-capability: evidence.record
      security:
        - serviceBearer: []
      summary: Record immutable source-bound evidence for an exact plan and authority epoch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RunGuard"
                - $ref: "#/components/schemas/EvidenceInput"
      responses:
        "201":
          description: Evidence recorded or exact retry replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evidence" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /runs/{runId}/operations:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Operations]
      operationId: reportOperationalState
      x-capability: operation.report
      security:
        - serviceBearer: []
      summary: Report provider-neutral rollout, observation, rollback, and policy state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RunGuard"
                - $ref: "#/components/schemas/OperationalStateInput"
      responses:
        "200":
          description: Current operational state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalState" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /channels:
    get:
      tags: [Channels]
      operationId: listProjectChannels
      x-capability: channel.list
      security:
        - serviceBearer: []
      summary: List agent-native conversation channels without treating chat as work authority
      parameters:
        - { name: project_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Project channels
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /channels/{channelId}/messages:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Channels]
      operationId: listChannelMessages
      x-capability: channel.message.list
      security:
        - serviceBearer: []
      summary: List ordered channel messages and canonical references
      responses:
        "200":
          description: Channel messages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ChannelMessage" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Channels]
      operationId: appendChannelMessage
      x-capability: channel.message.append
      security:
        - serviceBearer: []
      summary: Append a message which carries references but no ambient execution authority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                references: { $ref: "#/components/schemas/CanonicalReferences" }
      responses:
        "201":
          description: Message appended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelMessage" }
        "422": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /decisions:
    get:
      tags: [Decisions]
      operationId: listDecisions
      x-capability: decision.list
      security:
        - serviceBearer: []
      summary: List human decision requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, answered, cancelled]
      responses:
        "200":
          description: Decision list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Decision"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /decisions/{decisionId}/answer:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Decisions]
      operationId: answerDecision
      x-capability: decision.answer
      security:
        - serviceBearer: []
      summary: Record the human answer to a pending decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer:
                  type: string
      responses:
        "200":
          description: Answered decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /decisions/{decisionId}:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Decisions]
      operationId: getDecision
      x-capability: decision.inspect
      security:
        - serviceBearer: []
      summary: Get one decision so an agent can wait for its answer
      responses:
        "200":
          description: Decision state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /events:
    get:
      tags: [Events]
      operationId: listEvents
      x-capability: event.list
      security:
        - serviceBearer: []
      summary: List durable workspace events
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: after_id
          in: query
          description: Return events newer than this event ID in ascending order
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /events/stream:
    get:
      tags: [Events]
      operationId: streamEvents
      x-capability: event.stream
      security:
        - serviceBearer: []
      summary: Subscribe to live durable events and agent heartbeats
      parameters:
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Server-Sent Event stream with JSON-encoded Event values
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    operatorSession:
      type: apiKey
      in: cookie
      name: appdeck_operator_session
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        High-entropy service credential resolved to a stable identity with
        explicit project and capability grants. AppDeck stores only SHA-256
        fingerprints; Marina loads the token value from a file reference.

  headers:
    RequestId:
      description: Correlates this response with service logs and structured errors.
      schema:
        type: string
        maxLength: 128
    WWWAuthenticate:
      description: Bearer authentication challenge for the AppDeck service API.
      schema:
        type: string

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller correlation ID containing letters, digits, `-`, `_`, `.`, or `:`.
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Stable caller-generated key for replaying one claim or run mutation.
        Keys are scoped to the canonical project, caller identity, and operation.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]+$'
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string

  responses:
    AuthenticationRequired:
      description: A valid AppDeck service credential is required
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          $ref: "#/components/headers/WWWAuthenticate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The service identity lacks the required project or capability grant
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: The service authorization policy cannot be loaded safely
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested resource does not exist
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >-
        The resource changed, is no longer available, or the Idempotency-Key was
        already used with a different request payload
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidInput:
      description: Invalid input or state transition
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    RunGuard:
      type: object
      required: [agent_id, expected_version, fence_token]
      properties:
        agent_id: { type: string }
        expected_version: { type: integer, format: int64, minimum: 1 }
        fence_token: { type: integer, format: int64, minimum: 1 }

    ProviderInfo:
      type: object
      x-fixture: ./fixtures/v1/provider-info.json
      required: [provider, protocol_version, capabilities, server_time, ready, readiness]
      properties:
        provider:
          type: string
          const: appdeck
        protocol_version:
          type: string
          const: "1.0"
          description: Work-control semantic version implemented behind `/api/v1`.
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
          example:
            - provider.info
            - work.ready.list
            - work.inspect
            - work.claim.atomic
            - run.lease.renew
        server_time:
          type: integer
          format: int64
          description: Current UTC Unix time in milliseconds.
        ready:
          type: boolean
          description: Whether the provider can currently serve canonical work-control state.
        readiness:
          type: object
          additionalProperties:
            type: string
          example:
            store: available

    TaskStatus:
      type: string
      enum:
        - backlog
        - ready
        - planning
        - waiting_decision
        - running
        - verifying
        - done
        - blocked
        - failed
        - cancelled

    Priority:
      type: string
      enum: [low, medium, high, urgent]

    Task:
      type: object
      x-fixture: ./fixtures/v1/task.json
      required:
        - id
        - project_id
        - title
        - description
        - acceptance_criteria
        - status
        - priority
        - budget_minutes
        - budget
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        description:
          type: string
        acceptance_criteria:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        budget_minutes:
          type: integer
        budget:
          $ref: "#/components/schemas/Budget"
        assigned_agent_id:
          type: string
        version:
          type: integer
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    CreateTask:
      type: object
      required: [title]
      properties:
        project_id:
          type: string
          default: prj_default
        title:
          type: string
        description:
          type: string
        acceptance_criteria:
          type: string
        status:
          type: string
          enum: [backlog, ready]
          default: backlog
        priority:
          $ref: "#/components/schemas/Priority"
        budget_minutes:
          type: integer
          minimum: 1
          default: 30
        budget:
          $ref: "#/components/schemas/Budget"

    UpdateTask:
      type: object
      properties:
