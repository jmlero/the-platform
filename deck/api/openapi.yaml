    Agent:
      type: object
      x-fixture: ./fixtures/v1/agent.json
      required: [id, installation_id, name, kind, status, capabilities, last_seen_at, created_at]
      properties:
        id:
          type: string
        installation_id:
          type: string
        name:
          type: string
        kind:
          type: string
