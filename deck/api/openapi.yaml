        capabilities:
          type: array
          items:
            type: string
        last_seen_at:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64

    RegisterAgent:
      type: object
      required: [id, installation_id, name]
      properties:
        id:
          type: string
          description: Stable agent ID; generated when omitted
        installation_id:
          type: string
          description: Stable Marina installation identity distinct from runtime attempts
        name:
