          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderInfo"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

