              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ContextSource"
        "401":
          description: "Authentication required"
        "403":
          description: "Project or capability not authorized"
        "404":
          description: "Resource not found"
        "409":
          description: "Revision conflict"
        "422":
          description: "Invalid context selection"
      x-capability: context.read
  /runs/{id}/context:
    get:
      tags: ["Context"]
      operationId: "getRunContext"
      description: "Resolve only the exact revisions frozen at authorization. Messages are immutable data with digests; revocation is returned separately. Context cannot increase authority or budgets."
      security: [{"serviceBearer": []}]
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}]
      responses:
        "200":
          description: "Context result"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResolvedContext"
        "401":
          description: "Authentication required"
        "403":
          description: "Project or capability not authorized"
        "404":
          description: "Resource not found"
        "409":
          description: "Revision conflict"
        "422":
          description: "Invalid context selection"
      x-capability: context.read
  /operator/tasks/{id}/artifacts/{digest}:
    get:
      tags: [Tasks]
      operationId: downloadOperatorEvidenceArtifact
      summary: Download registered verification bytes through the operator session
      description: Verifies the task ledger reference, configured artifact origin and SHA-256 digest before returning bytes. Requires an operator session when operator authentication is configured.
      security:
        - operatorSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: digest, in: path, required: true, schema: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}}
      responses:
        "200":
          description: Integrity-checked verification result, maximum 4 MiB
          content:
            application/json:
              schema: {type: object}
        "401": {description: Operator authentication required}
        "404": {description: No registered downloadable artifact}
        "502": {description: Artifact unavailable or failed integrity verification}
        "503": {description: Artifact credentials or trust configuration unavailable}
  /provider:
