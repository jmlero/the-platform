                expected_version: { type: integer, format: int64, minimum: 1 }
                fence_token: { type: integer, format: int64, minimum: 1 }
                operation_id: { type: string, maxLength: 256 }
                question: { type: string, maxLength: 2000 }
                options: { type: array, maxItems: 8, items: { type: string, maxLength: 200 } }
                expires_at: { type: integer, format: int64 }
      responses:
        "200":
