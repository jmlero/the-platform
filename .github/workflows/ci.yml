name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out monorepo
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            deck/go.sum
            marina/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deck/web/package-lock.json

      - name: Install Deck frontend dependencies
        run: npm --prefix deck/web ci

      - name: Install browser test toolchain
        run: deck/web/node_modules/.bin/playwright install --with-deps chromium

      - name: Run independent product checks
        run: make check

      - name: Run Deck browser end-to-end tests
        run: make -C deck browser-test

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deck-browser-failures
          path: |
            deck/web/test-results/
            deck/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run real-process work-control conformance
        run: make conformance
