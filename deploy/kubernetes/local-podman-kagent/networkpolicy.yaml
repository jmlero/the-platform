apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: marina-to-kagent
  namespace: marina-system
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: marina}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kint-engine}
          podSelector:
            matchLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}
      ports: [{protocol: TCP, port: 8083}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kagent-from-marina
  namespace: kint-engine
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: marina-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: marina}
      ports: [{protocol: TCP, port: 8083}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kagent-egress-to-marina
  namespace: ate-system
spec:
  podSelector:
    matchLabels: {app: atenet-egress}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: marina-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: marina}
      ports: [{protocol: TCP, port: 8090}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: marina-from-kagent-egress
  namespace: marina-system
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: marina}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ate-system}
          podSelector:
            matchLabels: {app: atenet-egress}
      ports: [{protocol: TCP, port: 8090}]
