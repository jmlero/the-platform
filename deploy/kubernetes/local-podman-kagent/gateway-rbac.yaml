# Marina creates one Secret, ModelConfig and AgentTemplate per engine attempt
# and removes them after the attempt's engine instance is gone. It touches only
# resources it labeled `the-platform.dev/owner: marina` with a `marina-` name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: marina-engine-templates
  namespace: kint-engine
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch, delete]
  - apiGroups: [kagent.dev]
    resources: [modelconfigs, agenttemplates]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: marina-engine-templates
  namespace: kint-engine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: marina-engine-templates
subjects:
  - kind: ServiceAccount
    name: marina
    namespace: marina-system
