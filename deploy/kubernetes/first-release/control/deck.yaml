apiVersion: apps/v1
kind: Deployment
metadata:
  name: deck
spec:
  template:
    spec:
      containers:
        - name: deck
          env:
            - {name: DECK_TLS_CERT_FILE, value: /run/deck-tls/tls.crt}
            - {name: DECK_TLS_KEY_FILE, value: /run/deck-tls/tls.key}
            - {name: DECK_SERVICE_AUTH_FILE, value: /run/deck/service-auth.json}
            - {name: DECK_OPERATOR_AUTH_FILE, value: /run/deck/operator-auth.json}
            - {name: DECK_ARTIFACT_URL, value: "https://marina.marina-system.svc:8090"}
            - {name: DECK_ARTIFACT_TOKEN_FILE, value: /run/artifacts/token}
            - {name: DECK_ARTIFACT_CA_FILE, value: /run/worker-ca/ca.crt}
          startupProbe:
            httpGet: {scheme: HTTPS}
          readinessProbe:
            httpGet: {scheme: HTTPS}
          livenessProbe:
            httpGet: {scheme: HTTPS}
          volumeMounts:
            - {name: auth, mountPath: /run/deck, readOnly: true}
            - {name: artifacts, mountPath: /run/artifacts, readOnly: true}
            - {name: worker-ca, mountPath: /run/worker-ca, readOnly: true}
            - {name: tls, mountPath: /run/deck-tls, readOnly: true}
      volumes:
        - name: auth
          secret: {secretName: deck-auth, defaultMode: 288}
        - name: artifacts
          secret: {secretName: marina-artifact-auth, defaultMode: 288}
        - name: worker-ca
          configMap: {name: marina-worker-ca}
        - name: tls
          secret: {secretName: deck-tls, defaultMode: 288}
