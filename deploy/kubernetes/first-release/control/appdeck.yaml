apiVersion: apps/v1
kind: Deployment
metadata:
  name: appdeck
spec:
  template:
    spec:
      containers:
        - name: appdeck
          env:
            - {name: APPDECK_TLS_CERT_FILE, value: /run/appdeck-tls/tls.crt}
            - {name: APPDECK_TLS_KEY_FILE, value: /run/appdeck-tls/tls.key}
            - {name: APPDECK_SERVICE_AUTH_FILE, value: /run/appdeck/service-auth.json}
            - {name: APPDECK_OPERATOR_AUTH_FILE, value: /run/appdeck/operator-auth.json}
            - {name: APPDECK_ARTIFACT_URL, value: "https://marina.marina-system.svc:8090"}
            - {name: APPDECK_ARTIFACT_TOKEN_FILE, value: /run/artifacts/token}
            - {name: APPDECK_ARTIFACT_CA_FILE, value: /run/worker-ca/ca.crt}
          startupProbe:
            httpGet: {scheme: HTTPS}
          readinessProbe:
            httpGet: {scheme: HTTPS}
          livenessProbe:
            httpGet: {scheme: HTTPS}
          volumeMounts:
            - {name: auth, mountPath: /run/appdeck, readOnly: true}
            - {name: artifacts, mountPath: /run/artifacts, readOnly: true}
            - {name: worker-ca, mountPath: /run/worker-ca, readOnly: true}
            - {name: tls, mountPath: /run/appdeck-tls, readOnly: true}
      volumes:
        - name: auth
          secret: {secretName: appdeck-auth, defaultMode: 288}
        - name: artifacts
          secret: {secretName: marina-artifact-auth, defaultMode: 288}
        - name: worker-ca
          configMap: {name: marina-worker-ca}
        - name: tls
          secret: {secretName: appdeck-tls, defaultMode: 288}
