apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: workers-gateway-only}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: marina-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: marina}
      ports: [{protocol: TCP, port: 8090}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
