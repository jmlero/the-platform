# Bootstrap has no repository or model destination. Enable their explicit
# destinations in an installation overlay before enabling the workflow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: marina-bootstrap-egress
  namespace: marina-system
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: marina}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: deck}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
