# Podman's host forwarding gateway on macOS. The host publication is bound to
# 127.0.0.1 by kind.yaml. Adjust the /32 if your VM gateway differs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: appdeck-local-host
  namespace: marina-system
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: appdeck}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: "192.168.127.1/32"}
      ports: [{protocol: TCP, port: 8080}]
