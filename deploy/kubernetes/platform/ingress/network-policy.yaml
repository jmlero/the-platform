# The proxy accepts TLS on 8443 from anywhere, gets its configuration from
# the kgateway controller and forwards only to Deck.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: platform-ingress}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: proxy, namespace: platform-ingress}
spec:
  podSelector:
    matchLabels: {gateway.networking.k8s.io/gateway-name: platform}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{protocol: TCP, port: 8443}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kgateway-system}
      ports: [{protocol: TCP, port: 9977}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: marina-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: deck}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: deck-from-platform-ingress, namespace: marina-system}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: deck}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: platform-ingress}
          podSelector:
            matchLabels: {gateway.networking.k8s.io/gateway-name: platform}
      ports: [{protocol: TCP, port: 8080}]
