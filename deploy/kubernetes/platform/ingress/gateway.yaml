apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata: {name: platform, namespace: platform-ingress}
spec:
  kube:
    podTemplate:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
    envoyContainer:
      image:
        registry: cr.kgateway.dev/kgateway-dev
        repository: envoy-wrapper
        digest: sha256:37c2ecb3cef12f6cc1c46bbdfa07d17100034c13e197ed3a133f0f493d88cf83
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 500m, memory: 256Mi}
      securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
    service:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: platform, namespace: platform-ingress}
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef: {group: gateway.kgateway.dev, kind: GatewayParameters, name: platform}
  listeners:
    - name: tls
      port: 8443
      protocol: TLS
      tls: {mode: Passthrough}
      allowedRoutes:
        kinds: [{kind: TLSRoute}]
        namespaces:
          from: Selector
          selector:
            matchLabels: {kubernetes.io/metadata.name: marina-system}
