# Baseline for platform Pods (PLAT-05). The audit and enforce overlays set the
# namespaces, the action and the failure policy.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: workload-baseline
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  evaluation:
    admission: {enabled: true}
    background: {enabled: true}
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
    - name: labels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
  validations:
    - expression: "variables.containers.all(c, c.image.contains('@sha256:'))"
      message: Every container image must be pinned by digest.
    # Substrate's atelet runs gVisor sandboxes and must be privileged.
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) ||
        !has(c.securityContext.privileged) || !c.securityContext.privileged) ||
        (object.metadata.namespace == 'ate-system' &&
        variables.labels.?app.orValue('') == 'atelet')
      message: Privileged containers are not allowed.
    - expression: >-
        variables.containers.all(c, has(c.resources) && has(c.resources.limits) &&
        'memory' in c.resources.limits)
      message: Every container needs a memory limit.
    - expression: "'app.kubernetes.io/name' in variables.labels || 'app' in variables.labels"
      message: Pods need an app.kubernetes.io/name or app label.
