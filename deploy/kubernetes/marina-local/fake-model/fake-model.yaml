# A fixed OpenAI Responses API reply, so the platform can be tried and checked
# without a model account or spend. It accepts any caller key and never calls
# out. The private `fake-model-tls` Secret holds a certificate for
# fake-model.platform-gateway.svc from the installation CA.
apiVersion: v1
kind: ConfigMap
metadata: {name: fake-model, namespace: platform-gateway}
data:
  server.py: |
    import http.server, json, ssl

    TEXT = "Hello from the fake model. The platform path works."
    # Marina's chat asks for a JSON reply (a json_schema text format).
    STRUCTURED = json.dumps({"answer": TEXT, "delegation": None, "question": None, "prd": None, "prd_tasks": None})

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("Content-Length") or 0)
            request = json.loads(self.rfile.read(length)) if length else {}
            body = json.dumps({
                "id": "resp_fake", "object": "response", "status": "completed",
                "model": request.get("model", "fake"),
                "output": [{"type": "message", "id": "msg_fake", "role": "assistant", "status": "completed",
                            "content": [{"type": "output_text", "text": STRUCTURED if "text" in request else TEXT, "annotations": []}]}],
                "usage": {"input_tokens": 10, "output_tokens": 10, "total_tokens": 20},
            }).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            self.send_response(200)
            self.end_headers()

    server = http.server.ThreadingHTTPServer(("", 8443), Handler)
    context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
    context.load_cert_chain("/tls/tls.crt", "/tls/tls.key")
    server.socket = context.wrap_socket(server.socket, server_side=True)
    server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: fake-model, namespace: platform-gateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: fake-model}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fake-model}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: fake-model
          image: docker.io/library/python@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
          command: [python3, /app/server.py]
          ports: [{name: https, containerPort: 8443}]
          readinessProbe:
            httpGet: {path: /, port: https, scheme: HTTPS}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: app
          configMap: {name: fake-model}
        - name: tls
          secret: {secretName: fake-model-tls}
---
apiVersion: v1
kind: Service
metadata: {name: fake-model, namespace: platform-gateway}
spec:
  selector: {app.kubernetes.io/name: fake-model}
  ports: [{name: https, port: 443, targetPort: https}]
---
# Callers: Marina, and the engine's egress proxy for your own agents.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: fake-model, namespace: platform-gateway}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: fake-model}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: marina-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: marina}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ate-system}
          podSelector:
            matchLabels: {app: atenet-egress}
      ports: [{protocol: TCP, port: 8443}]
  egress: []
