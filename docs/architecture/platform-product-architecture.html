.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;appdeck-marina-explained&quot;&gt;
  &lt;style&gt;
    #appdeck-marina-explained {
      --appdeck-color: var(--viz-series-1);
      --marina-color: var(--viz-series-2);
      --external-color: var(--viz-series-3);
      color: var(--foreground);
      width: 100%;
    }

    #appdeck-marina-explained * {
      box-sizing: border-box;
    }

    #appdeck-marina-explained .topline,
    #appdeck-marina-explained .legend,
    #appdeck-marina-explained .node-top,
    #appdeck-marina-explained .detail-top,
    #appdeck-marina-explained .feedback-belt,
    #appdeck-marina-explained .boundary-strip {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    #appdeck-marina-explained .topline {
      justify-content: space-between;
      margin-bottom: 14px;
    }

    #appdeck-marina-explained .topline .viz-controls {
      margin: 0;
    }

    #appdeck-marina-explained .legend {
      color: var(--muted-foreground);
    }

    #appdeck-marina-explained .legend-line {
      display: inline-block;
      width: 19px;
      border-top: 2px solid var(--foreground);
    }

    #appdeck-marina-explained .legend-line.partial {
      border-top-style: dotted;
    }

    #appdeck-marina-explained .legend-line.planned {
      border-top: 1px dashed var(--muted-foreground);
    }

    #appdeck-marina-explained .explainer-view {
      display: none;
    }

    #appdeck-marina-explained .explainer-view.is-active {
      display: block;
    }

    #appdeck-marina-explained .overview-flow {
      display: grid;
      grid-template-columns:
        minmax(0, 0.72fr) 28px
        minmax(0, 1.05fr) 38px
        minmax(0, 1.12fr) 28px
        minmax(0, 0.86fr) 28px
        minmax(0, 0.82fr);
      gap: 7px;
      align-items: center;
    }

    #appdeck-marina-explained .station {
      min-width: 0;
      text-align: center;
    }

    #appdeck-marina-explained .station-mark {
      min-width: 0;
      padding: 10px 6px;
      border-top: 3px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    #appdeck-marina-explained .station-mark.human {
      border-top-color: color-mix(in srgb, var(--external-color) 72%, var(--border));
    }

    #appdeck-marina-explained .station-mark.appdeck {
      border-top-color: color-mix(in srgb, var(--appdeck-color) 78%, var(--border));
      background: color-mix(in srgb, var(--appdeck-color) 10%, transparent);
    }

    #appdeck-marina-explained .station-mark.marina {
      border-top-color: color-mix(in srgb, var(--marina-color) 78%, var(--border));
      background: color-mix(in srgb, var(--marina-color) 10%, transparent);
    }

    #appdeck-marina-explained .station-mark.planned {
      border: 1px dashed var(--border);
    }

    #appdeck-marina-explained .station-icon {
      width: 38px;
      height: 38px;
      margin: 0 auto 6px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--foreground);
      background: var(--background);
    }

    #appdeck-marina-explained .station-button.btn,
    #appdeck-marina-explained .layer-button.btn,
    #appdeck-marina-explained .journey-button.btn {
      display: block;
      width: 100%;
      min-width: 0;
      white-space: normal;
      text-align: left;
    }

    #appdeck-marina-explained .station-button.btn {
      text-align: center;
    }

    #appdeck-marina-explained .station-title,
    #appdeck-marina-explained .layer-title,
    #appdeck-marina-explained .journey-title,
    #appdeck-marina-explained .product-name,
    #appdeck-marina-explained .detail-title {
      font-weight: 500;
    }

    #appdeck-marina-explained .station-role,
    #appdeck-marina-explained .station-detail,
    #appdeck-marina-explained .layer-copy,
    #appdeck-marina-explained .journey-copy,
    #appdeck-marina-explained .product-purpose {
      display: block;
      color: var(--muted-foreground);
      margin-top: 4px;
    }

    #appdeck-marina-explained .station-role {
      color: var(--foreground);
    }

    #appdeck-marina-explained .flow-arrow {
      min-width: 0;
      text-align: center;
      color: var(--muted-foreground);
    }

    #appdeck-marina-explained .flow-arrow .arrow-glyph {
      display: block;
      color: var(--foreground);
      font-weight: 500;
      margin: 3px 0;
    }

    #appdeck-marina-explained .flow-arrow .mobile-glyph {
      display: none;
    }

    #appdeck-marina-explained .feedback-belt {
      justify-content: center;
      margin-top: 12px;
      padding: 9px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      color: var(--muted-foreground);
      text-align: center;
    }

    #appdeck-marina-explained .feedback-belt strong {
      color: var(--foreground);
      font-weight: 500;
    }

    #appdeck-marina-explained .plain-split {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    #appdeck-marina-explained .plain-role {
      min-width: 0;
      padding-top: 9px;
      border-top: 2px solid var(--border);
    }

    #appdeck-marina-explained .plain-role.appdeck {
      border-top-color: color-mix(in srgb, var(--appdeck-color) 75%, var(--border));
    }

    #appdeck-marina-explained .plain-role.marina {
      border-top-color: color-mix(in srgb, var(--marina-color) 75%, var(--border));
    }

    #appdeck-marina-explained .plain-role strong {
      display: block;
      font-weight: 500;
      margin-bottom: 3px;
    }

    #appdeck-marina-explained .inside-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 74px minmax(0, 1fr);
      gap: 12px;
      align-items: stretch;
    }

    #appdeck-marina-explained .product-column {
      min-width: 0;
      padding-top: 10px;
      border-top: 3px solid var(--border);
    }

    #appdeck-marina-explained .product-column.appdeck {
      border-top-color: color-mix(in srgb, var(--appdeck-color) 78%, var(--border));
    }

    #appdeck-marina-explained .product-column.marina {
      border-top-color: color-mix(in srgb, var(--marina-color) 78%, var(--border));
    }

    #appdeck-marina-explained .product-purpose {
      margin-bottom: 10px;
    }

    #appdeck-marina-explained .layer-stack {
      display: grid;
      gap: 5px;
    }

    #appdeck-marina-explained .layer-row {
      min-width: 0;
    }

    #appdeck-marina-explained .layer-row.planned {
      padding: 3px;
      border: 1px dashed var(--border);
    }

    #appdeck-marina-explained .layer-arrow {
      color: var(--muted-foreground);
      text-align: center;
    }

    #appdeck-marina-explained .node-top {
      justify-content: space-between;
      width: 100%;
    }

    #appdeck-marina-explained .bridge {
      position: relative;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted-foreground);
      text-align: center;
    }

    #appdeck-marina-explained .bridge::before {
      content: &quot;&quot;;
      position: absolute;
      top: 18px;
      bottom: 18px;
      left: 50%;
      border-left: 1px solid var(--border);
    }

    #appdeck-marina-explained .bridge-label {
      position: relative;
      padding: 8px 3px;
      background: var(--background);
    }

    #appdeck-marina-explained .bridge-label strong {
      display: block;
      color: var(--foreground);
      font-weight: 500;
      margin: 3px 0;
    }

    #appdeck-marina-explained .boundary-strip {
      justify-content: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      color: var(--muted-foreground);
      text-align: center;
    }

    #appdeck-marina-explained .boundary-strip strong {
      color: var(--foreground);
      font-weight: 500;
    }

    #appdeck-marina-explained .journey {
      position: relative;
      display: grid;
      gap: 8px;
    }

    #appdeck-marina-explained .journey::before {
      content: &quot;&quot;;
      position: absolute;
      top: 20px;
      bottom: 20px;
      left: 21px;
      border-left: 2px solid var(--border);
    }

    #appdeck-marina-explained .journey-step {
      position: relative;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    #appdeck-marina-explained .step-number {
      position: relative;
      z-index: 1;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 2px solid var(--border);
      border-radius: 50%;
      background: var(--background);
      font-weight: 500;
    }

    #appdeck-marina-explained .journey-step.appdeck .step-number {
      border-color: color-mix(in srgb, var(--appdeck-color) 75%, var(--border));
    }

    #appdeck-marina-explained .journey-step.marina .step-number {
      border-color: color-mix(in srgb, var(--marina-color) 75%, var(--border));
    }

    #appdeck-marina-explained .journey-step.planned .step-number {
      border-style: dashed;
    }

    #appdeck-marina-explained .journey-step.partial .step-number {
      border-style: dotted;
    }

    #appdeck-marina-explained .journey-button.btn {
      border-left: 3px solid var(--border);
    }

    #appdeck-marina-explained .journey-step.appdeck .journey-button.btn {
      border-left-color: color-mix(in srgb, var(--appdeck-color) 75%, var(--border));
    }

    #appdeck-marina-explained .journey-step.marina .journey-button.btn {
      border-left-color: color-mix(in srgb, var(--marina-color) 75%, var(--border));
    }

    #appdeck-marina-explained .journey-step.planned .journey-button.btn {
      border-left-style: dashed;
    }

    #appdeck-marina-explained .journey-step.partial .journey-button.btn {
      border-left-style: dotted;
    }

    #appdeck-marina-explained .selected-detail.card {
      margin-top: 14px;
    }

    #appdeck-marina-explained .detail-top {
      justify-content: space-between;
      margin-bottom: 6px;
    }

    #appdeck-marina-explained .detail-title {
      margin: 0;
    }

    #appdeck-marina-explained .detail-plain {
      margin: 0 0 10px;
    }

    #appdeck-marina-explained .detail-label {
      display: block;
      color: var(--muted-foreground);
      margin-bottom: 3px;
    }

    #appdeck-marina-explained .detail-value {
      overflow-wrap: anywhere;
    }

    @media (max-width: 700px) {
      #appdeck-marina-explained .overview-flow,
      #appdeck-marina-explained .inside-grid,
      #appdeck-marina-explained .plain-split {
        grid-template-columns: minmax(0, 1fr);
      }

      #appdeck-marina-explained .flow-arrow {
        padding: 2px 0;
      }

      #appdeck-marina-explained .flow-arrow .desktop-glyph {
        display: none;
      }

      #appdeck-marina-explained .flow-arrow .mobile-glyph {
        display: block;
      }

      #appdeck-marina-explained .bridge {
        min-height: 72px;
      }

      #appdeck-marina-explained .bridge::before {
        top: 50%;
        right: 18px;
        bottom: auto;
        left: 18px;
        border-top: 1px solid var(--border);
        border-left: 0;
      }

      #appdeck-marina-explained .bridge-label {
        padding: 3px 10px;
      }
    }
  &lt;/style&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
